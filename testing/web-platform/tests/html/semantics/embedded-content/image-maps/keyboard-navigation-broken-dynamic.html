<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Keyboard navigation during image map failure and recovery</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#sequential-focus-navigation">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="resources/keyboard-navigation.js"></script>
<body>
<script>
promise_test(async t => {
  const fixture = mapFixture(t);
  await imageState(fixture.image, true);
  await loadedOrder(fixture);
  await imageState(fixture.image, false);
  await crosses(fixture);
  await imageState(fixture.image, true);
  await loadedOrder(fixture);
}, "Loaded, broken and recovered maps preserve keyboard progress");

for (const backward of [false, true]) {
  promise_test(async t => {
    const fixture = mapFixture(t);
    await imageState(fixture.image, true);
    await test_driver.click(backward ? fixture.end : fixture.start);
    await tab(backward);
    assert_equals(document.activeElement, fixture.areas[backward ? 1 : 0]);
    await imageState(fixture.image, false);
    await reaches(backward ? fixture.start : fixture.end, backward);
    await imageState(fixture.image, true);
    await loadedOrder(fixture);
  }, `A focused map area becoming frameless does not trap ${backward ? "backward" : "forward"} navigation`);
}

promise_test(async t => {
  const fixture = mapFixture(t);
  await imageState(fixture.image, false);
  fixture.image.removeAttribute("usemap");
  await crosses(fixture);
  fixture.image.useMap = `#${fixture.map.name}`;
  await crosses(fixture);
  fixture.map.replaceChildren();
  await crosses(fixture);
}, "Changing the map association and removing areas preserves keyboard progress");
</script>
